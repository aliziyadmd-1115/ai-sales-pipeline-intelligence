name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce complete data and evaluation workflow
        run: |
          python -m src.prepare
          python -m src.evaluate
      - name: Run regression tests
        run: python -m pytest -q
      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            artifacts/*.json
            artifacts/*.csv
            docs/images/*.png

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sales-demo:${{ github.sha }} .
      - name: Verify running API
        run: |
          docker run -d --name sales-demo -p 127.0.0.1:8000:8000 sales-demo:${{ github.sha }}
          python scripts/smoke_api.py
      - name: Container logs
        if: failure()
        run: docker logs sales-demo
      - name: Stop container
        if: always()
        run: docker rm -f sales-demo
