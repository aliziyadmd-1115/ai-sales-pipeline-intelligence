name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reproduce model evaluation
        run: python -m src.evaluate
      - name: Run tests
        run: pytest -q
      - name: Build Docker image
        run: docker build -t ai-sales-pipeline-intelligence:${{ github.sha }} .
      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-${{ github.sha }}
          path: |
            artifacts/metrics.json
            artifacts/threshold_analysis.csv
            artifacts/score_band_performance.csv
            docs/images/*.png
